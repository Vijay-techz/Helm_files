apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcpserver
  namespace: default
  labels:
    app: mcpserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcpserver
  template:
    metadata:
      labels:
        app: mcpserver
    spec:
      serviceAccountName: mcpserver-sa
      containers:
        - name: mcpserver
          image: vijaytechz/k8s-mcp-server:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi